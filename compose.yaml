# ローカル開発用。PostgreSQL、backend の API、frontend、nginx を起動する。
# ブラウザは http://localhost:3000 を開く。本番と同じく、/api/* は backend、それ以外は frontend に振り分ける。
#
#   docker compose up --watch      起動して、ファイルの変更を監視する
#   docker compose down            止める（データは残る）
#   docker compose down -v         止めて、DB のデータも消す
#
# watch の動き（develop.watch）:
#   - backend/src の変更    → コンテナにコピーする。コンテナ内の `tsx watch` が API を再起動する。
#   - backend/scripts の変更 → API コンテナにコピーする。
#   - frontend/src の変更   → コンテナにコピーする。コンテナ内の `next dev` が反映する。
#   - package.json などの変更 → イメージを作り直して、コンテナを入れ替える。
# 本番用のイメージ（backend/Dockerfile、frontend/Dockerfile）とは別物で、この設定は開発専用。

name: hackathon

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  # マイグレーションを適用して終了する 1 回限りのサービス。新しい SQL を足したら `docker compose run --rm migrate` で再適用できる。
  # イメージのタグは backend/Dockerfile.migrate と揃える。
  migrate:
    image: arigaio/atlas:1.3.1-community-distroless@sha256:76cc66fb31f99d5d316676b8a9866ef4b6d6bf5aacc0639485d04848670839e4
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate", "apply", "--config", "file:///atlas.hcl", "--env", "compose"]
    volumes:
      - ./backend/atlas.hcl:/atlas.hcl:ro
      - ./backend/migrations:/migrations:ro

  # マイグレーションのあと、開発用データを入れる。同じ seed ID の既存行は日時・状態を含めて上書きする。
  seed:
    image: postgres:17-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGUSER: app
      PGPASSWORD: app
      PGDATABASE: app
    volumes:
      - ./infra/dev-seed/seed.sql:/seed.sql:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/seed.sql"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      OBJECT_STORAGE_DRIVER: mock
      MOCK_STORAGE_DIR: /var/lib/donee/mock-storage
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: app
      DATABASE_USER: app
      DATABASE_PASSWORD: app
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?Set a random secret of at least 32 characters in .env}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - mock-storage-data:/var/lib/donee/mock-storage
    command: ["sh", "-c", "pnpm exec tsx src/seed-evidence-photos.ts --apply && pnpm dev"]
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /repo/backend/src
        - action: sync
          path: ./backend/scripts
          target: /repo/backend/scripts
          initial_sync: true
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml

  # APIとは別プロセスで期限切れ・審査終了を更新する。各巡回は完了後に待機するため重複しない。
  jobs:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      OBJECT_STORAGE_DRIVER: mock
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: app
      DATABASE_USER: app
      DATABASE_PASSWORD: app
      JOB_INTERVAL_SECONDS: "60"
    command: ["pnpm", "exec", "tsx", "src/jobs-main.ts", "all"]
    develop:
      watch:
        - action: sync+restart
          path: ./backend/src
          target: /repo/backend/src
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  # Next.js の開発サーバー。ブラウザからは proxy 経由でアクセスする。
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    environment:
      # 開発サーバーのテレメトリ送信を止める。
      NEXT_TELEMETRY_DISABLED: "1"
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /repo/frontend/src
        - action: sync
          path: ./frontend/public
          target: /repo/frontend/public
        - action: sync+restart
          path: ./frontend/next.config.ts
          target: /repo/frontend/next.config.ts
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml

  # 本番の Ingress と同じ振り分け（/api/* は backend、それ以外は frontend）をするリバースプロキシ。
  # ブラウザは http://localhost:3000 だけを開く。振り分けは infra/dev-proxy/default.conf。
  proxy:
    image: nginx:1.29-alpine
    depends_on:
      - api
      - frontend
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./infra/dev-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
  mock-storage-data:
