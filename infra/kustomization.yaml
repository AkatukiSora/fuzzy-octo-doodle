apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fuzzy-octo-doodle
resources:
  - namespace.yaml
  - database.yaml
  - migrate.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - jobs
# 開発用のデータ(seed Job が流す)。compose も同じファイルを使う。
configMapGenerator:
  - name: dev-seed
    files:
      - seed.sql=dev-seed/seed.sql
# アプリは、スキーマの適用(migrate、wave 1)が終わってから更新する。
patches:
  - target:
      kind: CronJob
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "3"
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "3"
# イメージのタグはここで一元管理する。自動更新(Argo CD Image Updater)の書き戻し先でもある。
# 3 つのイメージは同じコミットから作る。スキーマとコードのずれを防ぐため、タグは同時に更新する。
images:
  - name: ghcr.io/akatukisora/fuzzy-octo-doodle-backend
    newTag: 20261110133227-7df7fb1
    newName: ghcr.io/akatukisora/fuzzy-octo-doodle-backend
  - name: ghcr.io/akatukisora/fuzzy-octo-doodle-frontend
    newTag: 20261110133002-4099552
    newName: ghcr.io/akatukisora/fuzzy-octo-doodle-frontend
  - name: ghcr.io/akatukisora/fuzzy-octo-doodle-migrate
    newTag: 20261110133227-7df7fb1
    newName: ghcr.io/akatukisora/fuzzy-octo-doodle-migrate
