apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: fuzzy-octo-doodle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/part-of: fuzzy-octo-doodle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: fuzzy-octo-doodle
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/akatukisora/fuzzy-octo-doodle-backend
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: OBJECT_STORAGE_DRIVER
              value: mock
            # 1Password ItemのSecret同期後に、S3へ切り替えるまでは未設定でも起動できるよう任意参照にする。
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: fuzzy-octo-doodle-s3
                  key: S3_ENDPOINT
                  optional: true
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: fuzzy-octo-doodle-s3
                  key: S3_REGION
                  optional: true
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: fuzzy-octo-doodle-s3
                  key: S3_BUCKET
                  optional: true
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: fuzzy-octo-doodle-s3
                  key: S3_ACCESS_KEY_ID
                  optional: true
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fuzzy-octo-doodle-s3
                  key: S3_SECRET_ACCESS_KEY
                  optional: true
            - name: S3_FORCE_PATH_STYLE
              valueFrom:
                secretKeyRef:
                  name: fuzzy-octo-doodle-s3
                  key: S3_FORCE_PATH_STYLE
                  optional: true
            # 認証方式が決まるまでの開発用の認証。固定の利用者として、認証なしで API を使える。
            # 公開ドメインに出るため、閉じたアプリの間だけ使う。backend は NODE_ENV=production だと
            # 起動に失敗するので、イメージの既定を上書きする。ID は seed Job が作る利用者。
            - name: NODE_ENV
              value: development
            - name: DEV_AUTH_USER_ID
              value: 11111111-1111-4111-8111-111111111111
            - name: DATABASE_HOST
              value: fuzzy-octo-doodle-db-rw
            - name: DATABASE_NAME_FILE
              value: /etc/database/dbname
            - name: DATABASE_USER_FILE
              value: /etc/database/username
            - name: DATABASE_PASSWORD_FILE
              value: /etc/database/password
            # CNPG は TLS 接続のみを受け付ける。-rw Service の名前はサーバー証明書の SAN に含まれる。
            - name: DATABASE_SSL_MODE
              value: verify-full
            - name: DATABASE_SSL_CA_FILE
              value: /etc/database/ca.crt
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: database
              mountPath: /etc/database
              readOnly: true
      volumes:
        - name: database
          projected:
            sources:
              - secret:
                  name: fuzzy-octo-doodle-db-app
                  items:
                    - key: dbname
                      path: dbname
                    - key: username
                      path: username
                    - key: password
                      path: password
              - secret:
                  name: fuzzy-octo-doodle-db-ca
                  items:
                    - key: ca.crt
                      path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: fuzzy-octo-doodle
spec:
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: fuzzy-octo-doodle
  ports:
    - name: http
      port: 8080
      targetPort: http
