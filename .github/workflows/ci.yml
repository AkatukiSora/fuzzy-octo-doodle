name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: donee_auth_test
        ports:
          - 55437:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d donee_auth_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DONEE_AUTH_TEST_PORT: "55437"
      DATABASE_HOST: "127.0.0.1"
      DATABASE_PORT: "55437"
      DATABASE_NAME: donee_auth_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: isolated-test-only
      OBJECT_STORAGE_DRIVER: mock
      BETTER_AUTH_URL: http://localhost:3000
      PORT: "55438"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to isolated test database
        run: >-
          docker run --rm --network host
          -v "$PWD/backend/migrations:/migrations:ro"
          arigaio/atlas:1.3.1-community-distroless@sha256:76cc66fb31f99d5d316676b8a9866ef4b6d6bf5aacc0639485d04848670839e4
          migrate apply --dir file:///migrations
          --url 'postgres://postgres@127.0.0.1:55437/donee_auth_test?sslmode=disable'
      - name: Auth and authorization integration tests
        run: pnpm --filter @app/backend exec tsx --test src/better-auth.test.ts
      - name: Browser authentication flows
        run: |
          set -euo pipefail
          pnpm --filter @app/frontend exec playwright install --with-deps chromium
          pnpm --filter @app/backend dev > /tmp/donee-auth-api.log 2>&1 &
          api_pid=$!
          pnpm --filter @app/frontend dev --port 3000 > /tmp/donee-auth-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:55438/healthz >/dev/null && curl -fsS http://localhost:3000/login >/dev/null; then
              break
            fi
            sleep 1
          done
          pnpm --filter @app/frontend test:auth-ui
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v3
      # 開発者がローカルで実行する `mise run ci` と同一の検証を行う。
      - run: mise run ci
      # ビルド成功だけでは実行時の 500 エラーを検知できないため、完成したイメージを起動して確認する。
      - name: Smoke-test frontend container
        run: |
          set -euo pipefail
          container="$(docker run --rm -d -p 127.0.0.1::3000 hackathon-frontend:ci)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          port="$(docker port "$container" 3000/tcp | awk -F: 'NR==1 {print $NF}')"
          for attempt in $(seq 1 30); do
            status="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/" || true)"
            case "$status" in
              200|301|302|303|307|308|404) exit 0 ;;
              500|502|503|504) docker logs "$container"; exit 1 ;;
            esac
            sleep 1
          done
          docker logs "$container"
          exit 1
